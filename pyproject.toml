[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextsafe-hsd"
version = "0.1.0"
description = "ContextSafe-HSD privacy-preserving text privatization pipeline for hate speech detection datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["better-profanity>=0.7.0"]
keywords = ["privacy", "hate-speech-detection", "nlp", "text-anonymization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
scrubadub = ["scrubadub"]
workbench = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
]
spacy-models = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
contextsafe-hsd = "contextsafe_hsd.cli:main"

[tool.setuptools.packages.find]
include = ["contextsafe_hsd*"]
exclude = ["tests*", "docs*", "agents*", "data*"]

[tool.setuptools.package-data]
contextsafe_hsd = ["resources/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

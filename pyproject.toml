[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ContextSafe-HSD"
version = "0.1.0"
description = "ContextSafe-HSD privacy-preserving text privatization pipeline for hate speech detection datasets."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["better-profanity>=0.7.0"]
keywords = ["privacy", "hate-speech-detection", "nlp", "text-anonymization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
author-risk = ["scikit-learn>=1.3"]
benchmark = ["scikit-learn>=1.3"]
classifier = ["scikit-learn>=1.3"]
data-prep = ["pyarrow>=15"]
dpmlm = ["dpmlm>=1.1.2"]
hf-utility = ["transformers>=4.40", "torch>=2.1"]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
token-actions = ["scikit-learn>=1.3"]
token-policy = [
  "transformers>=4.40",
  "torch>=2.1",
  "datasets>=2.19",
  "evaluate>=0.4",
  "seqeval>=1.2",
]

[project.scripts]
contextsafe-hsd = "privhsd.cli:main"
privhsd = "privhsd.cli:main"

[tool.setuptools.packages.find]
include = ["contextsafe_hsd*", "privhsd*"]
exclude = ["tests*", "docs*", "agents*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

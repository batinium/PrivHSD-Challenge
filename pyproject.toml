[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privhsd"
version = "0.1.0"
description = "Privacy-preserving text privatization pipeline for hate speech detection datasets."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["privacy", "hate-speech-detection", "nlp", "text-anonymization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
author-risk = ["scikit-learn>=1.3"]
benchmark = ["scikit-learn>=1.3"]
classifier = ["scikit-learn>=1.3"]

[project.scripts]
privhsd = "privhsd.cli:main"

[tool.setuptools.packages.find]
include = ["privhsd*"]
exclude = ["tests*", "docs*", "agents*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
